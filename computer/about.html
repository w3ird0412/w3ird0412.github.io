              </h2>
            </div>
            <p>
              中原部落 (Alang Nakahara) 位於南投縣仁愛鄉，是賽德克族德奇塔雅群巴蘭社、卡奇克社、塔卡南社三社族人，因日治時期興建萬大水庫及「五年理蕃計畫」被迫遷居至清流與眉原之間的台地而形成的聚落，以梅子產業、傳統織布文化和半穴居傳統建築聞名，現為推廣原住民文化的重要基地。 
            </p>
