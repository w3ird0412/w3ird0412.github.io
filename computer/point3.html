<audio id="myAudio" src="music/music.mp3"></audio>

<script>
// 讀取資料
let count3 = Number(localStorage.getItem("counter3")) || 0;
let hasCounted3 = localStorage.getItem("hasCounted3");

// 如果還沒計數過 → 才 +1
if (!hasCounted3) {
    count3 += 40;
    localStorage.setItem("counter3", count3);
    localStorage.setItem("hasCounted3", "true"); // 記錄已經計過
}


const modal = document.getElementById("myModal");
const closeBtn = document.querySelector(".close");

// ❶ 網頁載入後自動跳出
window.onload = () => {
  const hasCounted3 = localStorage.getItem("hasCounted3");

  if (!hasCounted3) {
    modal.style.display = "block";
  }
};


// ❷ 按 X 關閉
closeBtn.onclick = () => {
  modal.style.display = "none";
}

// ❸ 點背景也關閉（可選）
window.onclick = (e) => {
  if (e.target === modal) modal.style.display = "none";
}

const btn = document.getElementById("musicBtn");
const audio = document.getElementById("myAudio");

btn.addEventListener("click", (e) => {
  e.preventDefault(); // 阻止 <a> 跳轉

  if (audio.paused) {
    audio.play();
    btn.innerText = "暫停導覽";
  } else {
    audio.pause();
    btn.innerText = "語音導覽";
  }
});
</script>
