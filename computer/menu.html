<script>
let count1 = Number(localStorage.getItem("counter1")) || 0;
let count2 = Number(localStorage.getItem("counter2")) || 0;
let count3 = Number(localStorage.getItem("counter3")) || 0;
document.getElementById("num").innerText = count1 + count2 + count3;



document.addEventListener("DOMContentLoaded", () => {

  const pages = [
    { key: "hasCounted1", box: "box1", btn: "btn1", text: "text1" },
    { key: "hasCounted2", box: "box2", btn: "btn2", text: "text2" },
    { key: "hasCounted3", box: "box3", btn: "btn3", text: "text3" }
  ];

  pages.forEach(page => {
    const done = localStorage.getItem(page.key);
	const boxEl = document.getElementById(page.box);
    const btnEl = document.getElementById(page.btn);
    const textEl = document.getElementById(page.text);

    if (done) {
      btnEl.classList.add("done");
      textEl.classList.add("done");
      textEl.innerText = "已完成";
    } else {
      textEl.innerText = "未完成";
    }
  });
 
  

});



</script>
